<header class="header text-center text-secondary py-4 mb-4">
  <h1>Documentos</h1>
</header>

<div class="m-3">
  <button (click)="add()" class="btn btn-secondary">
    <i class="bi bi-plus-circle"></i> Agregar documento
  </button>
</div>

<ag-grid-angular
  *ngIf="rowData.length > 0"
  style="
    width: 100%;
    height: 60%;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  "
  [rowData]="rowData"
  [columnDefs]="columnDefs"
  [gridOptions]="gridOptions"
  [pagination]="true"
  [theme]="myTheme"
  class="table table-striped table-hover"
>
</ag-grid-angular>

<shared-custom-modal-component></shared-custom-modal-component>
