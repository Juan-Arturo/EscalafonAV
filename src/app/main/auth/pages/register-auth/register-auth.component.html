<div>
    <form class="form page-title">
        <h1 class="text-align-center">Registrate</h1>
        <div class="flex-column">
          <label>Nombre </label>
          <div class="inputForm">
            <i class="bi bi-person-circle"></i>
            <input type="text" class="input" placeholder="Ingresa tu nombre">
          </div>
        </div> 

        <div class="flex-column">
          <label>Apellido paterno </label>
          <div class="inputForm">
            <i class="bi bi-person-circle"></i>
            <input type="text" class="input" placeholder="Ingresa tu primer apellido">
          </div>
        </div> 

        <div class="flex-column">
          <label>Apellido materno </label>
          <div class="inputForm">
            <i class="bi bi-person-circle"></i>
            <input type="text" class="input" placeholder="Ingresa tu segundo apellido">
          </div>
        </div> 

        <div class="flex-column">
          <label>Correo electrónico </label>
          <div class="inputForm">
            <i class="bi bi-envelope-fill"></i>
            <input type="text" class="input" placeholder="Ingresa tu correo">
          </div>
        </div> 
        
        <div class="flex-column">
          <label>Contraseña </label>
          <div class="inputForm">
            <svg height="20" viewBox="-64 0 512 512" width="20" xmlns="http://www.w3.org/2000/svg"><path d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"></path><path d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"></path></svg>        
            <input type="password" class="input" placeholder="Ingresa tu contraseña">
          </div>
        </div>

        <div class="flex-row">
        </div>
    
        <button class="button-submit">Registrarme</button>

        <p class="p">¿Ya estás registrado? <span class="span">Inicia sesión</span>
    
    </form>
</div>
